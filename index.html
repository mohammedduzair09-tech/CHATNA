<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>DostChat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--brand:#0f766e;--brand-d:#0b5a54;--bg:#efeae2;--me:#d5f5e3;--card:#fff;--ink:#1b1f23;--mute:#667085;--line:#e4e7ec}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.screen{height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;background:var(--card)}
header{background:var(--brand);color:#fff;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;gap:10px}
header h1{font-size:19px;flex:1}
header small{opacity:.8;font-size:12px;display:block}
button{font:inherit;cursor:pointer;border:0;border-radius:10px}
.ic{background:rgba(255,255,255,.18);color:#fff;padding:7px 11px;font-size:14px}
.ic:focus-visible,.go:focus-visible,input:focus-visible{outline:3px solid #99f6e4;outline-offset:2px}
input{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;width:100%;background:#fff;color:var(--ink)}
.auth{padding:28px 22px;display:flex;flex-direction:column;gap:12px;justify-content:center;flex:1}
.auth h2{font-size:28px;color:var(--brand)}
.auth p{color:var(--mute);margin-bottom:6px}
.go{background:var(--brand);color:#fff;padding:13px;font-weight:600}
.link{background:none;color:var(--brand);padding:8px;text-decoration:underline}
.err{color:#b42318;min-height:20px;font-size:14px}
.search{padding:10px 12px;border-bottom:1px solid var(--line)}
.list{flex:1;overflow:auto}
.row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:#f6f8f7}
.av{width:44px;height:44px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.row small{color:var(--mute)}
.empty{padding:28px 20px;color:var(--mute);text-align:center}
.bub{flex:1;overflow:auto;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:6px}
.b{max-width:80%;padding:8px 11px;border-radius:12px 12px 12px 3px;background:#fff;align-self:flex-start;overflow-wrap:anywhere;white-space:pre-wrap;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.b.me{align-self:flex-end;background:var(--me);border-radius:12px 12px 3px 12px}
.b i{display:block;font-size:11px;color:var(--mute);text-align:right;font-style:normal;margin-top:2px}
.bar{display:flex;gap:8px;padding:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));background:#f6f6f6}
.bar .go{padding:0 18px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}
.modal div.card{background:#fff;border-radius:16px;padding:22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:300px}
</style>
</head>
<body>

<section id="auth" class="screen" hidden>
  <div class="auth">
    <h2>DostChat</h2>
    <p>Sirf doston ke liye private chat.</p>
    <input id="un" placeholder="Username (a-z, 0-9, _)" autocomplete="username" hidden>
    <input id="em" type="email" placeholder="Email" autocomplete="email">
    <input id="pw" type="password" placeholder="Password (min 6)" autocomplete="current-password">
    <div class="err" id="err" role="alert"></div>
    <button class="go" id="go">Login</button>
    <button class="link" id="tog">Naya account banao</button>
  </div>
</section>

<section id="home" class="screen" hidden>
  <header>
    <h1>DostChat<small id="who"></small></h1>
    <button class="ic" id="qrb">My QR</button>
    <button class="ic" id="out">Logout</button>
  </header>
  <div class="search">
    <input id="q" placeholder="Username search karo dost ko add karne ke liye" autocomplete="off">
    <div id="res"></div>
  </div>
  <div class="list" id="list"></div>
</section>

<section id="chat" class="screen" hidden>
  <header>
    <button class="ic" id="back" aria-label="Back">&larr;</button>
    <h1 id="pn"></h1>
  </header>
  <div class="bub" id="bub"></div>
  <div class="bar">
    <input id="msg" placeholder="Message likho" autocomplete="off">
    <button class="go" id="sd">Send</button>
  </div>
</section>

<div class="modal" id="qrm" hidden>
  <div class="card">
    <b>Dost ko ye QR scan karne do</b>
    <div id="qrbox"></div>
    <small>Phone camera se scan karke chat khul jayegi</small>
    <button class="go" id="qrc" style="padding:10px 24px">Close</button>
  </div>
</div>

<script>
// 1) Supabase me Project Settings > API se ye 2 values yahan paste karo
const SUPABASE_URL = 'YOUR_SUPABASE_URL';
const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const valid = u => /^[a-z0-9_]{3,20}$/.test(u);
let me = null, peer = null, msgs = [], names = {}, signup = false, chan = null;

function show(id){ ['auth','home','chat'].forEach(x => $(x).hidden = x !== id); }

$('tog').onclick = () => {
  signup = !signup;
  $('un').hidden = !signup;
  $('go').textContent = signup ? 'Sign up' : 'Login';
  $('tog').textContent = signup ? 'Account hai? Login karo' : 'Naya account banao';
  $('err').textContent = '';
};

$('go').onclick = async () => {
  const email = $('em').value.trim(), pw = $('pw').value, u = $('un').value.trim().toLowerCase();
  $('err').textContent = '';
  try {
    if (signup) {
      if (!valid(u)) throw Error('Username 3-20 characters: a-z, 0-9, _');
      const { data, error } = await sb.auth.signUp({ email, password: pw });
      if (error) throw error;
      if (!data.session) throw Error('Email confirm karo, phir login karo');
      const r = await sb.from('profiles').insert({ id: data.user.id, username: u });
      if (r.error) throw Error(r.error.code === '23505' ? 'Ye username le liya gaya hai, login karke naya chuno' : r.error.message);
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (error) throw error;
    }
    await start();
  } catch (e) { $('err').textContent = e.message; }
};

async function loadNames(){
  const ids = [...new Set(msgs.flatMap(m => [m.sender, m.receiver]))].filter(i => !names[i]);
  if (!ids.length) return;
  const { data } = await sb.from('profiles').select('id,username').in('id', ids);
  (data || []).forEach(p => names[p.id] = p.username);
}

async function start(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return show('auth');
  me = session.user;
  let { data: p } = await sb.from('profiles').select('*').eq('id', me.id).maybeSingle();
  while (!p) {
    const u = (prompt('Username chuno (a-z, 0-9, _)') || '').trim().toLowerCase();
    if (!valid(u)) continue;
    const r = await sb.from('profiles').insert({ id: me.id, username: u }).select().single();
    p = r.data;
  }
  me.username = p.username;
  $('who').textContent = '@' + p.username;
  const { data } = await sb.from('messages').select('*').order('created_at');
  msgs = data || [];
  await loadNames();
  if (chan) sb.removeChannel(chan);
  chan = sb.channel('msgs').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async pl => {
    msgs.push(pl.new);
    await loadNames();
    renderHome();
    if (!$('chat').hidden) renderChat();
  }).subscribe();
  renderHome();
  show('home');
  const add = new URLSearchParams(location.search).get('add');
  if (add) {
    const { data: u } = await sb.from('profiles').select('id,username').eq('username', add.toLowerCase()).maybeSingle();
    if (u && u.id !== me.id) openChat(u);
  }
}

function renderHome(){
  const last = {};
  msgs.forEach(m => { last[m.sender === me.id ? m.receiver : m.sender] = m; });
  const rows = Object.entries(last).sort((a, b) => b[1].created_at.localeCompare(a[1].created_at));
  $('list').innerHTML = rows.length ? rows.map(([id, m]) =>
    `<div class="row" data-id="${id}"><div class="av">${esc((names[id] || '?')[0].toUpperCase())}</div><div><b>${esc(names[id] || '...')}</b><br><small>${m.sender === me.id ? 'You: ' : ''}${esc(m.body.slice(0, 40))}</small></div></div>`
  ).join('') : '<p class="empty">Abhi koi chat nahi. Upar username search karo ya dost ka QR scan karo.</p>';
  $('list').querySelectorAll('.row').forEach(r => r.onclick = () => openChat({ id: r.dataset.id, username: names[r.dataset.id] }));
}

$('q').oninput = async e => {
  const v = e.target.value.trim().toLowerCase().replace(/[^a-z0-9_]/g, '');
  if (!v) { $('res').innerHTML = ''; return; }
  const { data } = await sb.from('profiles').select('id,username').ilike('username', v + '%').neq('id', me.id).limit(8);
  $('res').innerHTML = (data || []).map(u =>
    `<div class="row" data-id="${u.id}" data-u="${esc(u.username)}"><div class="av">${esc(u.username[0].toUpperCase())}</div><b>${esc(u.username)}</b></div>`
  ).join('') || '<p class="empty">Koi nahi mila</p>';
  $('res').querySelectorAll('.row').forEach(r => r.onclick = () => {
    $('q').value = ''; $('res').innerHTML = '';
    openChat({ id: r.dataset.id, username: r.dataset.u });
  });
};

function openChat(u){
  peer = u; names[u.id] = u.username;
  $('pn').textContent = u.username;
  show('chat'); renderChat(); $('msg').focus();
}

function renderChat(){
  const b = $('bub');
  b.innerHTML = msgs.filter(m => m.sender === peer.id || m.receiver === peer.id).map(m =>
    `<div class="b ${m.sender === me.id ? 'me' : ''}">${esc(m.body)}<i>${new Date(m.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</i></div>`
  ).join('');
  b.scrollTop = b.scrollHeight;
}

async function send(){
  const t = $('msg').value.trim();
  if (!t || !peer) return;
  $('msg').value = '';
  const { error } = await sb.from('messages').insert({ receiver: peer.id, body: t });
  if (error) { alert(error.message); $('msg').value = t; }
}

$('sd').onclick = send;
$('msg').onkeydown = e => { if (e.key === 'Enter') send(); };
$('back').onclick = () => { peer = null; renderHome(); show('home'); };
$('out').onclick = async () => { await sb.auth.signOut(); location.href = location.pathname; };
$('qrb').onclick = () => {
  $('qrbox').innerHTML = '';
  new QRCode($('qrbox'), { text: location.origin + location.pathname + '?add=' + me.username, width: 200, height: 200 });
  $('qrm').hidden = false;
};
$('qrc').onclick = () => $('qrm').hidden = true;

start();
</script>
</body>
</html>
